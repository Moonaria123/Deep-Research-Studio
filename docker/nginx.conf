server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve service names at request time so an API container recreate does not leave
    # nginx pinned to the old Docker-network IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8787;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE stream (disable buffering for event-stream)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # API auth (DR-ITER-027): when the API runs with DEEPRESEARCH_AUTH_MODE=token, the
        # browser bundle has no token, so inject it here for the same-origin web → api hop.
        # Keep the token out of the image: template it in, e.g. via envsubst at container start.
        # proxy_set_header Authorization "Bearer ${DEEPRESEARCH_AUTH_TOKEN}";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
