name: deep-research-studio

x-runtime: &runtime
  image: ${DEEPRESEARCH_API_IMAGE:-deep-research-studio-api:1.0.0}
  build:
    context: ..
    dockerfile: docker/Dockerfile.api
  restart: unless-stopped
  environment:
    DEEPRESEARCH_CONFIG: /data/config.json
    DEEPRESEARCH_DB_PATH: /data/baseline.sqlite3
    DEEPRESEARCH_VAULT_KEY_FILE: /run/deepresearch-secrets/vault.key
    DEEPRESEARCH_REDIS_URL: redis://redis:6379/0
    DEEPRESEARCH_JOB_BACKEND: rq
    DEEPRESEARCH_LOCAL_WEB_GUARD: "1"
    DEEPRESEARCH_WEB_ORIGINS: http://127.0.0.1:${DEEPRESEARCH_WEB_PORT:-15175},http://localhost:${DEEPRESEARCH_WEB_PORT:-15175},http://127.0.0.1:${DEEPRESEARCH_API_PORT:-18789},http://localhost:${DEEPRESEARCH_API_PORT:-18789}
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - type: bind
      source: ${DEEPRESEARCH_DATA_DIR:?Set DEEPRESEARCH_DATA_DIR to an absolute host path}
      target: /data
      bind:
        create_host_path: false
    - release-key:/run/deepresearch-secrets:ro
  depends_on:
    key-holder:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  key-holder:
    image: ${DEEPRESEARCH_API_IMAGE:-deep-research-studio-api:1.0.0}
    restart: unless-stopped
    network_mode: none
    read_only: true
    command: [python, -c, "import time; time.sleep(2147483647)"]
    volumes:
      - release-key:/run/deepresearch-secrets
    healthcheck:
      test: [CMD, python, -c, "import re,stat,sys; from pathlib import Path; p=Path('/run/deepresearch-secrets/vault.key'); s=p.lstat(); sys.exit(0 if stat.S_ISREG(s.st_mode) and stat.S_IMODE(s.st_mode)==0o400 and re.fullmatch('[0-9a-f]{64}',p.read_text().strip()) else 1)"]
      interval: 3s
      timeout: 3s
      retries: 3
  api:
    <<: *runtime
    ports:
      - "127.0.0.1:${DEEPRESEARCH_API_PORT:-18789}:8787"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/v1/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
  worker:
    <<: *runtime
    command: [python, -m, deepresearch_core.baseline.worker]
    healthcheck:
      test: [CMD, python, -c, "import redis; from rq import Queue,Worker; c=redis.Redis.from_url('redis://redis:6379/0'); assert c.ping() and Worker.count(connection=c,queue=Queue('deepresearch',connection=c))>0"]
      interval: 5s
      timeout: 4s
      retries: 20
  semantic-worker:
    <<: *runtime
    command: [python, -m, deepresearch_core.baseline.semantic_worker]
    healthcheck:
      test: [CMD, python, -c, "import redis; from rq import Queue,Worker; c=redis.Redis.from_url('redis://redis:6379/0'); assert c.ping() and Worker.count(connection=c,queue=Queue('deepresearch-semantic',connection=c))>0"]
      interval: 5s
      timeout: 4s
      retries: 20
  redis:
    image: ${DEEPRESEARCH_REDIS_IMAGE:-redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065}
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 15
  web:
    image: ${DEEPRESEARCH_WEB_IMAGE:-deep-research-studio-web:1.0.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEEPRESEARCH_WEB_PORT:-15175}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  release-key:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1048576,mode=0700
