[package]
name = "deep-research-studio-desktop"
version = "1.1.0-alpha.3"
description = "Windows desktop client for Deep Research Studio Gen1"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-shell = "2.3.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust", "Win32_UI_Shell",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
